<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayBall</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <div id="hud">
      <span id="score-red">0</span>
      <span id="team-red">RED</span>
      <span id="timer">3:00</span>
      <span id="team-blue">BLUE</span>
      <span id="score-blue">0</span>
    </div>
    <div id="canvas-wrap">
      <canvas id="gameCanvas" width="800" height="500"></canvas>
      <div id="game-notif" class="game-notif-hidden">
        <div id="game-notif-inner">
          <div id="game-notif-icon"></div>
          <div id="game-notif-text"></div>
        </div>
      </div>
      <div id="overlay">
        <div id="overlay-box">
          <div id="overlay-score"></div>
          <h1 id="overlay-title">PLAYBALL</h1>
          <p id="overlay-msg">Choose game mode</p>
          <div id="settings-row">
            <div class="setting-group">
              <label for="setting-time">Time Limit</label>
              <div class="setting-input-wrap">
                <button class="setting-btn" data-target="setting-time" data-delta="-1">−</button>
                <span id="setting-time-display">3:00</span>
                <input id="setting-time" type="hidden" value="3">
                <button class="setting-btn" data-target="setting-time" data-delta="1">+</button>
              </div>
              <span class="setting-sub">minutes (0 = unlimited)</span>
            </div>
            <div class="setting-sep"></div>
            <div class="setting-group">
              <label for="setting-goals">Score Limit</label>
              <div class="setting-input-wrap">
                <button class="setting-btn" data-target="setting-goals" data-delta="-1">−</button>
                <span id="setting-goals-display">3</span>
                <input id="setting-goals" type="hidden" value="3">
                <button class="setting-btn" data-target="setting-goals" data-delta="1">+</button>
              </div>
              <span class="setting-sub">goals (0 = unlimited)</span>
            </div>
            <div class="setting-sep"></div>
            <div class="setting-group">
              <label for="setting-extrap">Extrap.</label>
              <div class="setting-input-wrap">
                <button class="setting-btn" data-target="setting-extrap" data-delta="-5" data-min="0" data-max="500">−</button>
                <input id="setting-extrap" class="setting-extrap-input" type="number" min="0" max="500" step="5" value="200">
                <button class="setting-btn" data-target="setting-extrap" data-delta="5" data-min="0" data-max="500">+</button>
              </div>
              <span class="setting-sub">ms lag comp (0 = off)</span>
            </div>
          </div>
          <div id="name-row">
            <div class="name-group">
              <input id="name-red" type="text" maxlength="20" placeholder="YOUR NICKNAME" spellcheck="false">
            </div>
            <div class="name-group name-group-num" id="tag-group">
              <label for="player-number">Your Tag</label>
              <input id="player-number" type="text" maxlength="2" placeholder="10" spellcheck="false" autocomplete="off">
            </div>
          </div>
          <button id="btn-confirm-name" style="display:none">LET'S PLAY</button>
          <div id="dropdowns-row">
            <div class="dropdown-group">
              <label>Stadium</label>
              <select id="sel-theme">
                <option value="default">🟢 Default</option>
                <option value="arsenal" selected>🔴 Arsenal</option>
                <option value="barcelona">🔵 Barcelona</option>
                <option value="realmadrid">⭐ Real Madrid</option>
                <option value="liverpool">🔴 Liverpool</option>
                <option value="mancity">🩵 Man City</option>
                <option value="chelsea">🔵 Chelsea</option>
                <option value="bayernmunich">🔴 Bayern Munich</option>
                <option value="manutd">🔴 Man United</option>
                <option value="psg">🔵 PSG</option>
                <option value="dortmund">🟡 Dortmund</option>
                <option value="acmilan">🔴 AC Milan</option>
                <option value="inter">🔵 Inter Milan</option>
              </select>
            </div>
            <div class="dropdown-group">
              <label>Field Size</label>
              <select id="sel-size">
                <option value="tiny">Tiny</option>
                <option value="small">Small</option>
                <option value="medium" selected>Medium</option>
                <option value="large">Large</option>
                <option value="xl">Extra Large</option>
              </select>
            </div>
          </div>

          <div id="ai-row" style="display:none">
            <button class="diff-btn diff-easy"   id="diff-easy">EASY</button>
            <button class="diff-btn diff-medium" id="diff-medium">MEDIUM</button>
            <button class="diff-btn diff-hard"   id="diff-hard">HARD</button>
            <input id="sel-diff" type="hidden" value="medium">
          </div>
          <div id="btn-row">
            <button id="btn-ai">vs AI</button>
            <button id="btn-online">Online</button>
          </div>
          <div id="name-display" style="display:none"></div>
          <div id="online-panel" style="display:none">
            <div id="net-error"></div>
            <div id="online-cols">
              <div class="online-col">
                <span class="online-col-label">New game</span>
                <button id="btn-create-room">Create Room</button>
              </div>
              <div class="online-divider"></div>
              <div class="online-col">
                <span class="online-col-label">Have a code?</span>
                <div class="online-join-inputs">
                  <input id="net-join-code" type="text" maxlength="4" placeholder="XXXX" spellcheck="false" autocomplete="off">
                  <button id="btn-join-room">Join</button>
                </div>
              </div>
            </div>
            <div id="net-waiting" style="display:none">
              Waiting for opponent… share this code:
              <strong id="net-code-display"></strong>
            </div>
          </div>
          <div id="pause-btn-row" style="display:none">
            <button id="btn-resume">Resume</button>
            <button id="btn-restart">Restart</button>
            <button id="btn-menu">Main Menu</button>
          </div>
        </div>
      </div>
    </div>
    <div id="chat-wrap">
      <div id="chat-log"></div>
      <div id="chat-input-row">
        <button id="chat-player-btn" class="chat-player red">RED</button>
        <input id="chat-input" type="text" maxlength="80" placeholder="Press Enter to chat..." autocomplete="off" spellcheck="false">
        <button id="chat-send">Send</button>
      </div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/state.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/network.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
